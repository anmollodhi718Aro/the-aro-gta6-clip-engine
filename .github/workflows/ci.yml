name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Pull-request updates supersede earlier runs for the same PR.
# Feature/integration branches are tested through their PR event, avoiding
# a duplicate push-triggered run for every commit.
concurrency:
  group: gta6-python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Compile source
        run: python -m compileall -q backend tests THE_ARO_STUDIO.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
