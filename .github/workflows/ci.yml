name: Python CI

on:
  push:
    branches: [main, "feature/**", "autonomous/**", "workstream/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes
      - name: Compile source
        run: python -m compileall -q backend tests scripts THE_ARO_STUDIO.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic end-to-end clip smoke
        run: python -m scripts.synthetic_single_clip_smoke
