name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Pull-request updates supersede earlier runs for the same PR.
# Feature/integration branches are tested through their PR event, avoiding
# a duplicate push-triggered run for every commit.
concurrency:
  group: gta6-python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q backend tests THE_ARO_STUDIO.py
      - name: Install FFmpeg on Linux for synthetic render validation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on Windows for synthetic render validation
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
