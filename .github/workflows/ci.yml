name: Python CI

on:
  push:
    branches: [main, "feature/**", "autonomous/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m compileall -q backend tests THE_ARO_STUDIO.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
