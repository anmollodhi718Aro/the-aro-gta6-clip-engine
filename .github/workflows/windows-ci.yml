name: Windows Python CI

on:
  push:
    branches:
      - workstream/aro-zero-one-clipping-first-2026-11-20
    paths:
      - ".github/workflows/windows-ci.yml"
      - "backend/**"
      - "tests/**"
      - "pyproject.toml"
      - "THE_ARO_STUDIO.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta6-windows-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed." }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg is unavailable." }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "FFprobe is unavailable." }
      - name: Compile source and tests
        run: python -m compileall -q backend tests THE_ARO_STUDIO.py
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
